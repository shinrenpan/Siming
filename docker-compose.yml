services:
  db:
    image: postgres:16-alpine
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${PGUSER:-siming}
      POSTGRES_PASSWORD: ${PGPASSWORD:-siming}
      POSTGRES_DB: ${PGDATABASE:-siming}
    ports:
      # Loopback only: the defaults are siming/siming. The app reaches db over the
      # compose network; this mapping is for scripts/run-macOS.sh and local tools.
      - "127.0.0.1:5432:5432"
    volumes:
      - siming_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-siming}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # `docker compose up` pulls the published image; `docker compose up --build` builds
    # this checkout instead (and tags the result with the same name).
    image: ghcr.io/shinrenpan/siming:${SIMING_VERSION:-latest}
    build:
      context: .
      args:
        # Low-memory hosts (≤ 8 GB for Docker): set in .env — see .env.example.
        SWIFT_BUILD_FLAGS: ${SWIFT_BUILD_FLAGS:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # .env's SERVER_PORT picks the host port above; the container always listens on
      # 8080, which the port mapping and healthcheck assume.
      SERVER_PORT: "8080"
      # PGUSER / PGPASSWORD / PGDATABASE come from .env as-is — no URL to percent-encode.
      PGHOST: db
      PGPORT: "5432"
      MIGRATIONS_PATH: /app/migrations
    # packages/ is baked into the image (published or locally built) — never mount it:
    # an empty or missing host ./packages would hide the image's copy and the server
    # would start with no terminology.
    volumes:
      - ./config.yml:/app/config.yml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optional: HL7 FHIR Validator for deep TW Core profile validation.
  # Uncomment to enable $validate with StructureDefinition profile checks.
  # Then set VALIDATOR_URL=http://validator:4567 in your .env file.
  #
  # validator:
  #   image: infernocommunity/inferno-resource-validator:1.0.78
  #   ports:
  #     - "3500:4567"
  #   restart: unless-stopped

volumes:
  siming_pgdata:
